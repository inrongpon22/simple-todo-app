name: Building

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm ci
      - run: npm run build

      - name: Discord Notification
        # uses: appleboy/discord-action@master
        if: always()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "content": "🚀 **Workflow ${{ github.workflow }}** finished with status: **${{ job.status }}**\nView details: https://github.com{{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' \
          ${{ secrets.DISCORD_WEBHOOK }}
